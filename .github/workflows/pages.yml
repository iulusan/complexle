name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm install rather than npm ci: the wasm32-wasi fallback variants of Tailwind's oxide
      # engine and Rolldown (never actually used — we always run on a real platform binary) pull
      # in @emnapi/* with loose ranges that publish new patches often enough to make the lockfile
      # go stale between when it's committed and when this runs. npm install reconciles that
      # instead of hard-failing like npm ci does.
      - run: npm install --no-audit --no-fund
      - run: npm run build:client
      # GitHub Pages has no server-side routing, so a direct load of /games/practice (or a
      # refresh) 404s without this — GitHub Pages serves 404.html's body as a fallback for any
      # unmatched path, and main.ts's router reads location.pathname to pick up from there.
      - run: cp dist-client/index.html dist-client/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
